  </g>

  <path d="M940 620L940 710H750" class="outline"/>
  <path d="M940 620L940 710H500" class="outline"/>
  <path d="M940 620L940 710H290" class="outline"/>

  <path d="M670 575H600V650" class="outline"/>
  <path d="M600 575H415V650" class="outline"/>
  <path d="M600 575H200V650" class="outline"/>
