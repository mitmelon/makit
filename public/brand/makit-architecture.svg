<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#5B6BFF"/>
    </marker>
    <style>
      .title { font: 700 30px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #171C2D; }
      .subtitle { font: 700 20px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #2B3247; }
      .nodeText { font: 600 20px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #1A1F2C; }
      .smallText { font: 500 16px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #4D5A75; }
      .label { font: 600 15px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #5B6BFF; }
      .box { fill: #F5F7FF; stroke: #D9E0FF; stroke-width: 2; }
      .signal { fill: #F4F7FF; stroke: #D7E2FF; stroke-width: 2; }
      .agent { fill: #FFFFFF; stroke: #BBC5FF; stroke-width: 2; }
      .api { fill: #EAF3FF; stroke: #B6D6FF; stroke-width: 2; }
      .digest { fill: #EEF7F5; stroke: #A8E4D0; stroke-width: 2; }
      .output { fill: #FFF4E7; stroke: #F7CA8C; stroke-width: 2; }
      .outline { fill: none; stroke: #5B6BFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #5B6BFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F8FAFC"/>

  <text x="800" y="64" text-anchor="middle" class="title">Makit: how the intelligence pipeline works</text>

