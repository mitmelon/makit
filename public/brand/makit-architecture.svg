    <text x="220" y="160" text-anchor="middle" class="subtitle">What it reads</text>

    <rect x="100" y="200" width="240" height="70" rx="18" class="agent"/>
    <text x="220" y="242" text-anchor="middle" class="nodeText">💱 Market prices</text>

    <rect x="100" y="290" width="240" height="70" rx="18" class="agent"/>
