    <rect x="100" y="470" width="240" height="70" rx="18" class="agent"/>
    <text x="220" y="512" text-anchor="middle" class="nodeText">🏪 Competitors</text>
  </g>

  <path d="M370 235H470" class="outline"/>
  <path d="M370 323H470" class="outline"/>
  <path d="M370 415H470" class="outline"/>
  <path d="M370 506H470" class="outline"/>

